services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsequeue-postgres
    environment:
      POSTGRES_DB: pulsequeue
      POSTGRES_USER: pulsequeue
      POSTGRES_PASSWORD: pulsequeue
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:

